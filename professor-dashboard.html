<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>교수용 대시보드 · Python 학습</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <link rel="stylesheet" href="style.css">
  <style>
    .grid-2 { display: grid; gap: 16px; grid-template-columns: 1fr; margin: 16px 0; }
    @media (min-width: 1000px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
    .kpis.five { grid-template-columns: repeat(2, 1fr); }
    @media (min-width: 900px) { .kpis.five { grid-template-columns: repeat(5, 1fr); } }
    .topic-row { display: grid; grid-template-columns: 130px 1fr 56px; gap: 12px; align-items: center; padding: 8px 0; font-size: .9rem; }
    .topic-row b { font-variant-numeric: tabular-nums; text-align: right; }
    .hard-q { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: .88rem; }
    .hard-q:last-child { border-bottom: 0; }
    .hard-q .rate { font-weight: 800; color: var(--danger); min-width: 48px; text-align: right; font-variant-numeric: tabular-nums; }
    .hard-q .txt { flex: 1; min-width: 0; color: var(--text-2); }
    .hist { display: flex; align-items: flex-end; gap: 6px; height: 140px; padding-top: 10px; }
    .hist .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
    .hist .col i { width: 100%; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, var(--primary), color-mix(in srgb, var(--primary) 55%, transparent)); min-height: 2px; transition: height .5s; }
    .hist .col span { font-size: .68rem; color: var(--muted); white-space: nowrap; }
    .hist .col em { font-style: normal; font-size: .72rem; font-weight: 700; color: var(--text-2); }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .toolbar .input { max-width: 280px; height: 40px; }
    .toolbar .select { width: auto; height: 40px; }
    .seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; }
    .seg button { border: 0; background: none; padding: 7px 12px; border-radius: 9px; font-weight: 700; font-size: .85rem; color: var(--muted); cursor: pointer; }
    .seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
    .table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .table tr.top td:first-child .medal { box-shadow: 0 0 0 2px var(--surface); }
    .namecell { display: flex; align-items: center; gap: 10px; }
    .namecell .avatar { width: 30px; height: 30px; border-radius: 9px; font-size: .8rem; }
    .mini { width: 110px; }
    .sort-ind { opacity: .5; font-size: .7rem; }
    .warn-box { margin-top: 12px; padding: 10px 14px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: .85rem; font-weight: 600; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="professor-dashboard.html"><span class="brand-logo"><span>🐍</span></span><span>교수용 대시보드<small>Python 학습 시스템</small></span></a>
      <nav class="nav-links collapsible">
        <a href="professor-dashboard.html" class="active">📊 학생 현황</a>
        <a href="question-admin.html">📚 문제 관리</a>
        <a href="dashboard.html" target="_blank" rel="noopener">🏆 리더보드</a>
      </nav>
      <div class="spacer"></div>
      <span class="badge badge-neutral"><span class="dot live" id="live-dot"></span>&nbsp;<span id="live-text">연결 중</span></span>
      <button class="icon-btn" data-theme-toggle aria-label="테마 전환"></button>
    </div>
  </header>

  <main class="wrap">
    <section class="page-hero">
      <div class="eyebrow">Instructor View</div>
      <h1>📊 실시간 학생 현황</h1>
      <p>학생들이 문제를 풀 때마다 자동으로 갱신됩니다.</p>
    </section>

    <section class="kpis five">
      <div class="card kpi"><span class="kpi-label">👥 전체 학생</span><span class="kpi-value" id="k-total">–</span></div>
      <div class="card kpi"><span class="kpi-label">🟢 지금 접속 (5분)</span><span class="kpi-value" id="k-online">–</span></div>
      <div class="card kpi"><span class="kpi-label">📅 24시간 활동</span><span class="kpi-value" id="k-active">–</span></div>
      <div class="card kpi"><span class="kpi-label">✅ 평균 해결 문제</span><span class="kpi-value" id="k-solved">–</span></div>
      <div class="card kpi"><span class="kpi-label">⭐ 평균 점수</span><span class="kpi-value" id="k-score">–</span></div>
    </section>

    <section class="grid-2">
      <div class="card card-pad">
        <div class="section-head"><div class="card-title">📈 점수 분포</div><span class="muted" style="font-size:.8rem">학생 수</span></div>
        <div class="hist" id="hist"></div>
      </div>
      <div class="card card-pad">
        <div class="section-head"><div class="card-title">🧩 주제별 평균 완료율</div><span class="muted" style="font-size:.8rem" id="topic-note"></span></div>
        <div id="topic-bars"></div>
      </div>
    </section>

    <section class="card card-pad" style="margin-bottom:16px">
      <div class="section-head"><div class="card-title">🚧 학생들이 가장 어려워하는 문제</div><span class="muted" style="font-size:.8rem">정답률 낮은 순 · 새 버전 기록 기준</span></div>
      <div id="hard-list"><div class="muted">데이터 수집 중…</div></div>
    </section>

    <section class="card card-pad">
      <div class="section-head">
        <div class="card-title">👥 학생 목록</div>
        <button class="btn btn-soft btn-sm" id="csv-btn">📥 CSV 다운로드</button>
      </div>
      <div class="toolbar">
        <input class="input" id="search" placeholder="🔍 이름 또는 학번 검색">
        <select class="select" id="level-filter">
          <option value="">전체 레벨</option>
          <option value="1-4">Lv.1 – 4</option>
          <option value="5-9">Lv.5 – 9</option>
          <option value="10-19">Lv.10 – 19</option>
          <option value="20-999">Lv.20 이상</option>
        </select>
        <div class="seg" id="scope">
          <button data-v="15" class="on">상위 15명</button>
          <button data-v="all">전체</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="table" id="table">
          <thead><tr>
            <th class="sortable" data-k="rank">순위 <span class="sort-ind"></span></th>
            <th class="sortable" data-k="name">이름 <span class="sort-ind"></span></th>
            <th>학번</th>
            <th class="sortable num" data-k="level">레벨 <span class="sort-ind"></span></th>
            <th class="sortable num" data-k="score">점수 <span class="sort-ind"></span></th>
            <th class="sortable num" data-k="solved">해결 <span class="sort-ind"></span></th>
            <th class="sortable num" data-k="streak">연속 <span class="sort-ind"></span></th>
            <th>진도</th>
            <th class="sortable" data-k="last">마지막 활동 <span class="sort-ind"></span></th>
          </tr></thead>
          <tbody id="tbody"><tr><td colspan="9"><div class="skeleton" style="height:40px"></div></td></tr></tbody>
        </table>
      </div>
      <div id="table-note"></div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="common.js"></script>
  <script>
    let students = [], invalidCount = 0, qIndex = {}, totalQ = 0;
    const view = { scope: '15', sortKey: 'rank', sortDir: 1, search: '', level: '' };

    database.ref('.info/connected').on('value', s => {
      const on = s.val() === true;
      $('#live-dot').className = 'dot' + (on ? ' live' : '');
      $('#live-text').textContent = on ? '실시간' : '연결 끊김';
    });

    // 문제 목록 (주제별 문항 수, 문항 텍스트)
    database.ref('questions').on('value', snap => {
      const data = snap.val() || {};
      qIndex = {}; totalQ = 0;
      for (const cat in data) for (const key in data[cat]) {
        const q = data[cat][key];
        if (!q || q.enabled === false) continue;
        qIndex[`${cat}__${key}`] = { cat, key, id: q.id || key, text: q.question || '', difficulty: q.difficulty };
        totalQ++;
      }
      renderInsights();
      renderTable();
    });

    database.ref('students').on('value', snap => {
      const data = snap.val() || {};
      const all = Object.values(data);
      const valid = all.filter(isValidStudent);
      invalidCount = all.length - valid.length;
      students = valid.map(s => ({
        name: s.studentName.trim(), id: String(s.studentId).trim(),
        score: s.score || 0, solved: s.solved || 0, streak: s.streak || 0,
        level: Math.max(s.level || 1, levelFromScore(s.score)),
        last: s.lastUpdated || null, lastT: s.lastUpdated ? new Date(s.lastUpdated).getTime() : 0,
        solvedIds: s.solvedIds || {}
      })).sort(rankSort);
      let prev = null, r = 0;
      students.forEach((s, i) => { if (!prev || rankSort(prev, s) !== 0) r = i + 1; s.rank = r; prev = s; });
      renderKpis(); renderInsights(); renderTable();
    }, err => { $('#tbody').innerHTML = `<tr><td colspan="9" class="empty">⚠️ ${escapeHtml(err.message)}</td></tr>`; });

    function renderKpis() {
      const n = students.length, now = Date.now();
      $('#k-total').textContent = fmt(n);
      $('#k-online').textContent = fmt(students.filter(s => now - s.lastT < 5 * 60e3).length);
      $('#k-active').textContent = fmt(students.filter(s => now - s.lastT < 86400e3).length);
      $('#k-solved').textContent = n ? (students.reduce((a, s) => a + s.solved, 0) / n).toFixed(1) : 0;
      $('#k-score').textContent = n ? fmt(Math.round(students.reduce((a, s) => a + s.score, 0) / n)) : 0;
    }

    function renderInsights() {
      // 점수 분포 (6구간)
      const max = Math.max(1000, ...students.map(s => s.score));
      const step = Math.ceil(max / 6 / 500) * 500;
      const bins = Array.from({ length: 6 }, (_, i) => ({ lo: i * step, hi: (i + 1) * step, n: 0 }));
      students.forEach(s => { bins[Math.min(5, Math.floor(s.score / step))].n++; });
      const top = Math.max(1, ...bins.map(b => b.n));
      $('#hist').innerHTML = bins.map(b => `<div class="col"><em>${b.n}</em><i style="height:${b.n / top * 100}%"></i><span>${fmt(b.lo)}~</span></div>`).join('');

      // 주제별 완료율 (solvedIds 기록이 있는 학생 기준)
      const tracked = students.filter(s => Object.keys(s.solvedIds).length);
      const perTopicTotal = {};
      Object.values(qIndex).forEach(q => perTopicTotal[q.cat] = (perTopicTotal[q.cat] || 0) + 1);
      $('#topic-note').textContent = tracked.length ? `기록 있는 학생 ${tracked.length}명 기준` : '새 버전 기록이 쌓이면 표시돼요';
      $('#topic-bars').innerHTML = TOPICS.filter(t => perTopicTotal[t.key]).map(t => {
        const tot = perTopicTotal[t.key];
        const avg = tracked.length ? tracked.reduce((a, s) => a + Object.keys(s.solvedIds).filter(k => k.startsWith(t.key + '__') && qIndex[k]).length / tot, 0) / tracked.length : 0;
        const p = Math.round(avg * 100);
        return `<div class="topic-row"><span>${t.icon} ${t.label} <span class="muted" style="font-size:.75rem">(${tot})</span></span><div class="bar success"><i style="width:${p}%"></i></div><b>${p}%</b></div>`;
      }).join('');

      // 정답률 낮은 문제
      if (!tracked.length) { $('#hard-list').innerHTML = '<div class="muted" style="font-size:.9rem">학생들이 새 버전에서 문제를 풀기 시작하면 정답률이 계산됩니다.</div>'; return; }
      const rates = Object.entries(qIndex).map(([uid, q]) => ({ q, rate: tracked.filter(s => s.solvedIds[uid]).length / tracked.length }))
        .sort((a, b) => a.rate - b.rate).slice(0, 6);
      $('#hard-list').innerHTML = rates.map(({ q, rate }) => `
        <div class="hard-q"><span class="rate">${Math.round(rate * 100)}%</span>
          <span class="badge badge-neutral">${escapeHtml((TOPIC_MAP[q.cat] || { label: q.cat }).label)} · ${escapeHtml(q.id)}</span>
          <span class="txt">${escapeHtml(q.text)}</span></div>`).join('');
    }

    function filtered() {
      let list = students;
      if (view.scope === '15' && !view.search && !view.level) list = list.filter(s => s.rank <= 15);
      if (view.search) { const t = view.search.toLowerCase(); list = list.filter(s => s.name.toLowerCase().includes(t) || s.id.toLowerCase().includes(t)); }
      if (view.level) { const [lo, hi] = view.level.split('-').map(Number); list = list.filter(s => s.level >= lo && s.level <= hi); }
      const k = view.sortKey, d = view.sortDir;
      return [...list].sort((a, b) => {
        const va = k === 'last' ? a.lastT : a[k], vb = k === 'last' ? b.lastT : b[k];
        if (typeof va === 'string') return va.localeCompare(vb, 'ko') * d;
        return (va - vb) * d;
      });
    }

    function renderTable() {
      $$('#table th.sortable').forEach(th => th.querySelector('.sort-ind').textContent = th.dataset.k === view.sortKey ? (view.sortDir > 0 ? '▲' : '▼') : '');
      if (!students.length) { $('#tbody').innerHTML = '<tr><td colspan="9"><div class="empty"><div class="big">🎓</div>아직 등록된 학생이 없습니다.</div></td></tr>'; return; }
      const list = filtered(), now = Date.now();
      $('#tbody').innerHTML = list.length ? list.map(s => {
        const online = now - s.lastT < 5 * 60e3;
        const pct = totalQ ? Math.min(100, Math.round(Math.max(s.solved, Object.keys(s.solvedIds).length) / totalQ * 100)) : 0;
        return `<tr class="${s.rank <= 3 ? 'top' : ''}">
          <td><span class="medal ${s.rank <= 3 ? 'r' + s.rank : ''}">${s.rank}</span></td>
          <td><div class="namecell"><span class="avatar">${escapeHtml(initial(s.name))}</span><b>${escapeHtml(s.name)}</b></div></td>
          <td class="mono" style="font-size:.85rem">${escapeHtml(s.id)}</td>
          <td class="num"><span class="badge badge-primary">Lv.${s.level}</span></td>
          <td class="num"><b>${fmt(s.score)}</b></td>
          <td class="num">${s.solved}</td>
          <td class="num">${s.streak ? '🔥' + s.streak : 0}</td>
          <td><div class="bar mini"><i style="width:${pct}%"></i></div></td>
          <td><span class="dot ${online ? 'live' : ''}"></span> <span class="${online ? '' : 'muted'}">${online ? '접속 중' : timeAgo(s.last)}</span></td>
        </tr>`;
      }).join('') : '<tr><td colspan="9"><div class="empty">조건에 맞는 학생이 없어요.</div></td></tr>';
      const notes = [];
      if (view.scope === '15' && !view.search && !view.level && students.length > 15) notes.push(`<div class="muted" style="text-align:center;margin-top:12px;font-size:.85rem">상위 15명 표시 중 · 전체 ${students.length}명 (‘전체’를 누르면 모두 볼 수 있어요)</div>`);
      if (invalidCount) notes.push(`<div class="warn-box">⚠️ 이름 또는 학번이 비어 있는 기록 ${invalidCount}건은 목록에서 제외했어요.</div>`);
      $('#table-note').innerHTML = notes.join('');
    }

    // 이벤트
    $('#search').addEventListener('input', e => { view.search = e.target.value.trim(); renderTable(); });
    $('#level-filter').addEventListener('change', e => { view.level = e.target.value; renderTable(); });
    $$('#scope button').forEach(b => b.addEventListener('click', () => {
      $$('#scope button').forEach(x => x.classList.toggle('on', x === b)); view.scope = b.dataset.v; renderTable();
    }));
    $$('#table th.sortable').forEach(th => th.addEventListener('click', () => {
      const k = th.dataset.k;
      if (view.sortKey === k) view.sortDir *= -1;
      else { view.sortKey = k; view.sortDir = (k === 'rank' || k === 'name') ? 1 : -1; }
      renderTable();
    }));
    setInterval(() => { renderKpis(); renderTable(); }, 30000); // '접속 중' 표시 갱신

    $('#csv-btn').addEventListener('click', () => {
      if (!students.length) return toast('내보낼 데이터가 없어요.', 'error');
      const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const head = ['순위', '이름', '학번', '레벨', '점수', '해결문제', '연속정답', ...TOPICS.map(t => t.label + '(해결)'), '마지막활동'];
      const rows = students.map(s => [s.rank, s.name, s.id, s.level, s.score, s.solved, s.streak,
        ...TOPICS.map(t => Object.keys(s.solvedIds).filter(k => k.startsWith(t.key + '__')).length),
        s.last ? new Date(s.last).toLocaleString('ko-KR') : '']);
      const csv = [head, ...rows].map(r => r.map(q).join(',')).join('\r\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
      a.download = `python_ranking_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast('CSV 파일을 내려받았어요.', 'success');
    });
  </script>
</body>
</html>
