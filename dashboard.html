<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>🏆 Class Leader Board · Python 학습</title>
  <meta name="theme-color" content="#2f6fde">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
  <link rel="stylesheet" href="style.css">
  <style>
    .live-pill { display: inline-flex; align-items: center; gap: 8px; font-size: .82rem; font-weight: 700; color: var(--muted); }
    .kpis { margin-bottom: 20px; }

    /* 포디움 */
    .podium { max-width: 680px; margin-left: auto !important; margin-right: auto !important; display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 12px; align-items: end; margin: 8px 0 24px; }
    .pod { text-align: center; padding: 18px 10px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
    .pod .crown { font-size: 1.8rem; line-height: 1; }
    .pod .avatar { width: 56px; height: 56px; border-radius: 18px; font-size: 1.3rem; }
    .pod.p1 .avatar { width: 68px; height: 68px; font-size: 1.6rem; background: linear-gradient(135deg, #ffd43b, #f59e0b); color: #4a3200; }
    .pod.p2 .avatar { background: linear-gradient(135deg, #cbd5e1, #94a3b8); color: #1f2937; }
    .pod.p3 .avatar { background: linear-gradient(135deg, #f3c69b, #c2783c); color: #3b1d05; }
    .pod .nm { font-weight: 800; font-size: 1rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pod .sc { font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; }
    .pod .sub { font-size: .72rem; color: var(--muted); white-space: nowrap; }
    .pod .step {
      width: 100%; border-radius: 16px 16px 0 0; margin-top: 8px; display: grid; place-items: center;
      font-size: 1.6rem; font-weight: 900; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.2);
    }
    .pod.p1 .step { height: 120px; background: linear-gradient(180deg, #ffd43b, #f5a300); }
    .pod.p2 .step { height: 88px; background: linear-gradient(180deg, #cbd5e1, #8a99ad); }
    .pod.p3 .step { height: 64px; background: linear-gradient(180deg, #f0b98a, #b8692e); }
    .pod.me .nm::after { content: " (나)"; color: var(--primary); }

    /* 순위 리스트 */
    .rank-list { display: flex; flex-direction: column; }
    .rank-row {
      display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center;
      padding: 12px 6px; border-bottom: 1px solid var(--border); animation: fadeUp .35s ease both;
    }
    .rank-row:last-child { border-bottom: 0; }
    .rank-row.me { background: var(--primary-soft); border-radius: 12px; border-bottom-color: transparent; padding: 12px 10px; }
    .rank-row .who { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .rank-row .who .avatar { width: 36px; height: 36px; font-size: .9rem; }
    .rank-row .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-row .id { font-size: .78rem; color: var(--muted); font-family: var(--mono); }
    .rank-row .stats { display: flex; gap: 18px; align-items: center; text-align: right; }
    .rank-row .stat { min-width: 48px; }
    .rank-row .stat.score { min-width: 64px; }
    .rank-row .stat b { display: block; font-weight: 800; font-variant-numeric: tabular-nums; }
    .rank-row .stat span { font-size: .72rem; color: var(--muted); }
    .rank-row .stat.score b { color: var(--primary); font-size: 1.05rem; }
    @media (max-width: 560px) { .rank-row .stat.hide-sm { display: none; } .rank-row .stats { gap: 12px; } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .me-card { display: flex; align-items: center; gap: 14px; padding: 16px 18px; margin-bottom: 16px; border: 1px solid color-mix(in srgb, var(--primary) 35%, var(--border)); }
    .me-card .big { font-size: 1.8rem; font-weight: 900; color: var(--primary); font-variant-numeric: tabular-nums; }
    .me-card .grow { flex: 1; min-width: 0; }
    .note { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); color: var(--muted); font-size: .85rem; text-align: center; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html"><span class="brand-logo"><span>🐍</span></span><span>Python 학습<small>우송대 AI경영학과</small></span></a>
      <nav class="nav-links collapsible">
        <a href="index.html">학습</a>
        <a href="dashboard.html" class="active">🏆 리더보드</a>
      </nav>
      <div class="spacer"></div>
      <span class="live-pill"><span class="dot live" id="live-dot"></span><span id="live-text">실시간 연결 중</span></span>
      <button class="icon-btn" data-theme-toggle aria-label="테마 전환"></button>
    </div>
  </header>

  <main class="wrap">
    <section class="page-hero">
      <div class="eyebrow">Class Leader Board</div>
      <h1>🏆 우리 반 Python 랭킹</h1>
      <p>문제를 풀면 순위가 실시간으로 바뀌어요. 상위 15명이 표시됩니다.</p>
    </section>

    <section class="kpis">
      <div class="card kpi"><span class="kpi-label">👥 참여 학생</span><span class="kpi-value" id="k-total">–</span></div>
      <div class="card kpi"><span class="kpi-label">⭐ 평균 점수</span><span class="kpi-value" id="k-avg">–</span></div>
      <div class="card kpi"><span class="kpi-label">✅ 함께 푼 문제</span><span class="kpi-value" id="k-solved">–</span></div>
      <div class="card kpi"><span class="kpi-label">🟢 오늘 학습한 학생</span><span class="kpi-value" id="k-today">–</span></div>
    </section>

    <div id="me-slot"></div>

    <section class="card card-pad">
      <div id="podium"></div>
      <div class="rank-list" id="rank-list">
        <div class="skeleton" style="height:56px;margin:6px 0"></div>
        <div class="skeleton" style="height:56px;margin:6px 0"></div>
        <div class="skeleton" style="height:56px;margin:6px 0"></div>
      </div>
      <div id="list-note"></div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="common.js"></script>
  <script>
    const MAX_DISPLAY = 15;
    const me = store.get('currentUser');

    database.ref('.info/connected').on('value', s => {
      const on = s.val() === true;
      $('#live-dot').className = 'dot' + (on ? ' live' : '');
      $('#live-text').textContent = on ? '실시간' : '연결 끊김';
    });

    database.ref('students').on('value', snap => render(snap.val() || {}), err => {
      $('#rank-list').innerHTML = `<div class="empty"><div class="big">⚠️</div>순위를 불러오지 못했어요<br><small>${escapeHtml(err.message)}</small></div>`;
    });

    function render(data) {
      const students = Object.values(data).filter(isValidStudent).map(s => ({
        name: s.studentName.trim(), id: String(s.studentId).trim(),
        score: s.score || 0, solved: s.solved || 0, level: Math.max(s.level || 1, levelFromScore(s.score)),
        streak: s.streak || 0, last: s.lastUpdated
      })).sort(rankSort);

      const n = students.length;
      const today = new Date().toDateString();
      $('#k-total').textContent = fmt(n);
      $('#k-avg').textContent = n ? fmt(Math.round(students.reduce((a, s) => a + s.score, 0) / n)) : 0;
      $('#k-solved').textContent = fmt(students.reduce((a, s) => a + s.solved, 0));
      $('#k-today').textContent = fmt(students.filter(s => s.last && new Date(s.last).toDateString() === today).length);

      if (!n) {
        $('#podium').innerHTML = '';
        $('#rank-list').innerHTML = `<div class="empty"><div class="big">🎓</div>아직 순위가 없어요.<br>학습 화면에서 첫 문제를 풀어 보세요!<br><br><a class="btn btn-primary" href="index.html">학습하러 가기</a></div>`;
        $('#me-slot').innerHTML = ''; $('#list-note').innerHTML = '';
        return;
      }

      // 동점자는 같은 순위
      let prev = null, rank = 0;
      students.forEach((s, i) => { if (!prev || rankSort(prev, s) !== 0) rank = i + 1; s.rank = rank; prev = s; });
      const isMe = s => me && String(me.studentId) === s.id;

      // 내 순위 카드
      const mine = students.find(isMe);
      $('#me-slot').innerHTML = mine ? `
        <div class="card me-card">
          <span class="avatar">${escapeHtml(initial(mine.name))}</span>
          <div class="grow"><div class="eyebrow">내 순위</div><b>${escapeHtml(mine.name)}</b> · ${fmt(mine.score)}점 · Lv.${mine.level}
            ${mine.rank > 1 ? `<div class="muted" style="font-size:.82rem">한 단계 위까지 ${fmt(Math.max(0, (students.filter(s => s.score > mine.score).pop()?.score ?? mine.score) - mine.score))}점 남았어요</div>` : '<div class="muted" style="font-size:.82rem">현재 1등이에요! 👑</div>'}
          </div>
          <div class="big">${mine.rank}<small style="font-size:.9rem;color:var(--muted)">위</small></div>
        </div>` : '';

      // 포디움
      const top = students.slice(0, 3);
      const podOrder = [top[1], top[0], top[2]];
      const cls = ['p2', 'p1', 'p3'];
      $('#podium').innerHTML = `<div class="podium">${podOrder.map((s, i) => s ? `
        <div class="pod ${cls[i]} ${isMe(s) ? 'me' : ''}">
          <div class="crown">${cls[i] === 'p1' ? '👑' : cls[i] === 'p2' ? '🥈' : '🥉'}</div>
          <span class="avatar">${escapeHtml(initial(s.name))}</span>
          <div class="nm" title="${escapeHtml(s.name)}">${escapeHtml(s.name)}</div>
          <div class="sc">${fmt(s.score)}점</div>
          <div class="sub">Lv.${s.level} · ${s.solved}문제</div>
          <div class="step">${s.rank}</div>
        </div>` : '<div></div>').join('')}</div>`;

      const rest = students.slice(3, MAX_DISPLAY);
      $('#rank-list').innerHTML = rest.map((s, i) => `
        <div class="rank-row ${isMe(s) ? 'me' : ''}" style="animation-delay:${i * 25}ms">
          <span class="medal">${s.rank}</span>
          <div class="who"><span class="avatar">${escapeHtml(initial(s.name))}</span>
            <div style="min-width:0"><div class="nm">${escapeHtml(s.name)}${isMe(s) ? ' <span class="badge badge-primary">나</span>' : ''}</div><div class="id">${escapeHtml(maskId(s.id))}</div></div></div>
          <div class="stats">
            <div class="stat hide-sm"><b>Lv.${s.level}</b><span>레벨</span></div>
            <div class="stat hide-sm"><b>${s.solved}</b><span>해결</span></div>
            <div class="stat score"><b>${fmt(s.score)}</b><span>점수</span></div>
          </div>
        </div>`).join('');
      $('#list-note').innerHTML = n > MAX_DISPLAY ? `<div class="note">상위 ${MAX_DISPLAY}명 표시 중 · 전체 ${n}명 참여</div>` : '';
    }
  </script>
</body>
</html>
