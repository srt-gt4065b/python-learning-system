<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>문제 관리 · Python 학습</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="stylesheet" href="style.css">
  <style>
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 12px 0 16px; }
    .toolbar .input { max-width: 300px; height: 40px; }
    .toolbar .select { width: auto; height: 40px; }
    .bulkbar {
      position: sticky; top: 64px; z-index: 20; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 10px 14px; border-radius: 14px; margin-bottom: 12px;
      background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(10px); border: 1px solid var(--border);
    }
    .bulkbar .grow { flex: 1; font-weight: 700; font-size: .9rem; }
    .qlist { display: flex; flex-direction: column; gap: 10px; }
    .qitem {
      display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: start;
      padding: 14px 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); transition: border-color .2s, background .2s;
    }
    .qitem:hover { border-color: color-mix(in srgb, var(--primary) 35%, var(--border)); }
    .qitem.sel { background: var(--primary-soft); border-color: color-mix(in srgb, var(--primary) 45%, var(--border)); }
    .qitem.off { opacity: .55; }
    .qitem input[type=checkbox] { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--primary); cursor: pointer; }
    .qitem .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
    .qitem .qid { font-family: var(--mono); font-size: .78rem; font-weight: 700; color: var(--muted); }
    .qitem .txt { font-size: .95rem; font-weight: 600; line-height: 1.5; word-break: keep-all; }
    .qitem .exp { margin-top: 6px; font-family: var(--mono); font-size: .78rem; color: var(--muted); white-space: pre-wrap; max-height: 3.2em; overflow: hidden; }
    .qitem .acts { display: flex; gap: 6px; align-items: center; }
    @media (max-width: 640px) { .qitem { grid-template-columns: 24px 1fr; } .qitem .acts { grid-column: 2; } }
    .switch { position: relative; width: 40px; height: 24px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--surface-3); cursor: pointer; transition: background .2s; }
    .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm); transition: transform .2s; }
    .switch input:checked + span { background: var(--success); }
    .switch input:checked + span::after { transform: translateX(16px); }
    .form-grid { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
    .form-grid .full { grid-column: 1 / -1; }
    @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
    .tester { border: 1px dashed var(--border); border-radius: 14px; padding: 14px; background: var(--surface-2); }
    .console { background: var(--code-bg); color: #b9f5d8; border-radius: 10px; padding: 10px 12px; font-family: var(--mono); font-size: .82rem; white-space: pre-wrap; min-height: 44px; margin-top: 8px; max-height: 200px; overflow: auto; }
    .console.err { color: #ffb4b6; }
    .drop {
      border: 2px dashed var(--border); border-radius: 16px; padding: 28px; text-align: center; cursor: pointer; transition: border-color .2s, background .2s;
    }
    .drop:hover, .drop.over { border-color: var(--primary); background: var(--primary-soft); }
    .preview { max-height: 280px; overflow: auto; margin-top: 14px; border: 1px solid var(--border); border-radius: 12px; }
    .preview .table td { white-space: normal; max-width: 240px; font-size: .8rem; }
    .issues { margin-top: 10px; font-size: .85rem; color: var(--warn); font-weight: 600; }
    .stat-line { display: flex; gap: 16px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); margin-top: 6px; }
    .stat-line b { color: var(--text); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="question-admin.html"><span class="brand-logo"><span>🐍</span></span><span>문제 관리<small>Python 학습 시스템</small></span></a>
      <nav class="nav-links collapsible">
        <a href="professor-dashboard.html">📊 학생 현황</a>
        <a href="question-admin.html" class="active">📚 문제 관리</a>
      </nav>
      <div class="spacer"></div>
      <button class="icon-btn" data-theme-toggle aria-label="테마 전환"></button>
    </div>
  </header>

  <main class="wrap">
    <section class="page-hero" style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap">
      <div>
        <div class="eyebrow">Question Bank</div>
        <h1>📚 문제 관리</h1>
        <div class="stat-line" id="stat-line"></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost" id="csv-open">📂 CSV 일괄 업로드</button>
        <button class="btn btn-primary" id="add-btn">＋ 새 문제</button>
      </div>
    </section>

    <section class="card card-pad">
      <nav class="tabs" id="tabs"></nav>
      <div class="toolbar">
        <input class="input" id="search" placeholder="🔍 문제 내용·ID 검색">
        <select class="select" id="diff-filter">
          <option value="">모든 난이도</option><option value="easy">쉬움</option><option value="medium">보통</option><option value="hard">어려움</option>
        </select>
        <select class="select" id="state-filter">
          <option value="">모든 상태</option><option value="on">활성</option><option value="off">비활성</option>
        </select>
      </div>
      <div class="bulkbar">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="check-all" style="width:18px;height:18px;accent-color:var(--primary)"> 전체</label>
        <span class="grow"><span id="sel-count">0</span>개 선택됨</span>
        <button class="btn btn-soft btn-sm" data-bulk="on">활성화</button>
        <button class="btn btn-soft btn-sm" data-bulk="off">비활성화</button>
        <button class="btn btn-danger btn-sm" data-bulk="delete">🗑️ 삭제</button>
      </div>
      <div class="qlist" id="qlist">
        <div class="skeleton" style="height:84px"></div><div class="skeleton" style="height:84px"></div><div class="skeleton" style="height:84px"></div>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="common.js"></script>
  <script src="questions-i18n.js"></script>
  <script>
    let all = [];                         // [{cat, key, ...data}]
    const selected = new Set();           // uid = cat__key
    const view = { cat: 'all', search: '', diff: '', state: '' };
    const uid = q => `${q.cat}__${q.key}`;

    /* ---------- 데이터 ---------- */
    database.ref('questions').on('value', snap => {
      const data = snap.val() || {};
      all = [];
      for (const cat in data) for (const key in data[cat]) all.push({ ...data[cat][key], cat, key });
      const ord = c => { const i = TOPICS.findIndex(t => t.key === c); return i < 0 ? 99 : i; };
      all.sort((a, b) => ord(a.cat) - ord(b.cat) || a.cat.localeCompare(b.cat) || (a.order || 999) - (b.order || 999) || a.key.localeCompare(b.key));
      [...selected].forEach(id => { if (!all.find(q => uid(q) === id)) selected.delete(id); });
      render();
    }, err => { $('#qlist').innerHTML = `<div class="empty">⚠️ ${escapeHtml(err.message)}</div>`; });

    const cats = () => [...new Set([...TOPICS.map(t => t.key), ...all.map(q => q.cat)])];
    const catLabel = c => (TOPIC_MAP[c] ? TOPIC_MAP[c].icon + ' ' + TOPIC_MAP[c].label : c);

    function visible() {
      return all.filter(q =>
        (view.cat === 'all' || q.cat === view.cat) &&
        (!view.diff || q.difficulty === view.diff) &&
        (!view.state || (view.state === 'on' ? q.enabled !== false : q.enabled === false)) &&
        (!view.search || `${q.id} ${q.key} ${q.question} ${q.example} ${q.hint}`.toLowerCase().includes(view.search.toLowerCase())));
    }

    function render() {
      const on = all.filter(q => q.enabled !== false).length;
      $('#stat-line').innerHTML = `<span>전체 <b>${all.length}</b>문제</span><span>활성 <b>${on}</b></span><span>비활성 <b>${all.length - on}</b></span>`;
      $('#tabs').innerHTML = [`<button class="chip ${view.cat === 'all' ? 'active' : ''}" data-cat="all">전체 <span class="count">${all.length}</span></button>`,
        ...cats().map(c => `<button class="chip ${view.cat === c ? 'active' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(catLabel(c))} <span class="count">${all.filter(q => q.cat === c).length}</span></button>`)].join('');
      $$('#tabs .chip').forEach(b => b.onclick = () => { view.cat = b.dataset.cat; render(); });

      const list = visible();
      $('#qlist').innerHTML = list.length ? list.map(q => {
        const d = DIFF[q.difficulty] || { label: q.difficulty || '?', cls: 'badge-neutral' };
        const id = uid(q);
        return `<div class="qitem ${selected.has(id) ? 'sel' : ''} ${q.enabled === false ? 'off' : ''}">
          <input type="checkbox" data-sel="${escapeHtml(id)}" ${selected.has(id) ? 'checked' : ''} aria-label="선택">
          <div style="min-width:0">
            <div class="meta">
              <span class="qid">${escapeHtml(q.id || q.key)}</span>
              <span class="badge badge-neutral">${escapeHtml(catLabel(q.cat))}</span>
              <span class="badge ${d.cls}">${escapeHtml(d.label)}</span>
              <span class="badge badge-neutral">순서 ${escapeHtml(q.order ?? '-')}</span>
              ${hasTr(q, 'en') && hasTr(q, 'zh') ? '<span class="badge badge-primary" title="영어·중국어 번역 있음">🌐 EN·中</span>' : `<span class="badge badge-medium" title="번역이 없으면 학생에게 한국어 원문이 보여요">🌐 번역 없음${hasTr(q, 'en') ? ' (中)' : hasTr(q, 'zh') ? ' (EN)' : ''}</span>`}
              ${q.expectedOutput === '' || q.expectedOutput == null ? '<span class="badge badge-hard">⚠ 예상 출력 없음</span>' : ''}
            </div>
            <div class="txt">${escapeHtml(q.question)}</div>
            <div class="exp">→ ${escapeHtml(q.expectedOutput)}</div>
          </div>
          <div class="acts">
            <label class="switch" title="${q.enabled === false ? '비활성' : '활성'}"><input type="checkbox" data-toggle="${escapeHtml(id)}" ${q.enabled !== false ? 'checked' : ''}><span></span></label>
            <button class="btn btn-ghost btn-sm" data-edit="${escapeHtml(id)}">수정</button>
            <button class="icon-btn" style="width:34px;height:34px" data-del="${escapeHtml(id)}" title="삭제">🗑️</button>
          </div>
        </div>`;
      }).join('') : '<div class="empty"><div class="big">📭</div>조건에 맞는 문제가 없어요.</div>';

      $$('[data-sel]').forEach(c => c.onchange = () => { c.checked ? selected.add(c.dataset.sel) : selected.delete(c.dataset.sel); render(); });
      $$('[data-toggle]').forEach(c => c.onchange = () => setEnabled([c.dataset.toggle], c.checked));
      $$('[data-edit]').forEach(b => b.onclick = () => openEditor(all.find(q => uid(q) === b.dataset.edit)));
      $$('[data-del]').forEach(b => b.onclick = () => confirmDelete([b.dataset.del]));
      $('#sel-count').textContent = selected.size;
      $('#check-all').checked = list.length > 0 && list.every(q => selected.has(uid(q)));
    }

    /* ---------- 일괄 작업 ---------- */
    $('#check-all').onchange = e => { visible().forEach(q => e.target.checked ? selected.add(uid(q)) : selected.delete(uid(q))); render(); };
    $$('[data-bulk]').forEach(b => b.onclick = () => {
      if (!selected.size) return toast('먼저 문제를 선택해 주세요.', 'error');
      const ids = [...selected];
      if (b.dataset.bulk === 'delete') confirmDelete(ids);
      else setEnabled(ids, b.dataset.bulk === 'on');
    });

    function setEnabled(ids, on) {
      const upd = {};
      ids.forEach(id => { const [cat, key] = id.split('__'); upd[`${cat}/${key}/enabled`] = on; });
      database.ref('questions').update(upd)
        .then(() => toast(`${ids.length}개 문제를 ${on ? '활성화' : '비활성화'}했어요.`, 'success'))
        .catch(e => toast('변경 실패: ' + e.message, 'error'));
    }

    function confirmDelete(ids) {
      const ov = modal(`
        <div class="modal-head"><h2>🗑️ ${ids.length}개 문제 삭제</h2></div>
        <p>삭제하면 되돌릴 수 없어요. 잠시 숨기고 싶다면 <b>비활성화</b>를 권장합니다.</p>
        <div class="modal-foot"><button class="btn btn-ghost" data-close>취소</button><button class="btn btn-danger" id="do-del">삭제</button></div>`);
      $('#do-del', ov).onclick = () => {
        const upd = {};
        ids.forEach(id => { const [cat, key] = id.split('__'); upd[`${cat}/${key}`] = null; });
        database.ref('questions').update(upd)
          .then(() => { ids.forEach(id => selected.delete(id)); ov.remove(); toast(`${ids.length}개 문제를 삭제했어요.`, 'success'); })
          .catch(e => toast('삭제 실패: ' + e.message, 'error'));
      };
    }

    /* ---------- 공통 모달 ---------- */
    function modal(html, wide = false) {
      const ov = document.createElement('div');
      ov.className = 'overlay';
      ov.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div>`;
      document.body.appendChild(ov);
      ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-close]')) ov.remove(); });
      const esc = e => { if (e.key === 'Escape') { ov.remove(); document.removeEventListener('keydown', esc); } };
      document.addEventListener('keydown', esc);
      return ov;
    }

    /* ---------- ID 생성 (기존 ID와 절대 겹치지 않음) ---------- */
    function nextKeys(cat, count, reserved = new Set()) {
      const prefix = 'Q' + cat.replace(/[^a-z]/gi, '').substring(0, 3).toUpperCase();
      const used = new Set([...all.filter(q => q.cat === cat).map(q => q.key), ...reserved]);
      let n = 0;
      used.forEach(k => { const m = String(k).match(/(\d+)$/); if (m) n = Math.max(n, +m[1]); });
      const out = [];
      while (out.length < count) { n++; const k = prefix + String(n).padStart(3, '0'); if (!used.has(k)) { out.push(k); used.add(k); } }
      return out;
    }

    /* ---------- 번역 (영어·중국어) ---------- */
    const TR_LANGS = [['en', 'English'], ['zh', '中文']];
    const TR_FIELDS = [['question', '문제'], ['example', '예시'], ['hint', '힌트']];
    const fileTr = (q, lang, field) => ((window.QUESTION_I18N || {})[uid(q)] || {})[lang]?.[field] || '';
    const trValue = (q, lang, field) => (q[`${field}_${lang}`] || fileTr(q, lang, field));
    const hasTr = (q, lang) => !!trValue(q, lang, 'question');

    /* ---------- 추가/수정 ---------- */
    function openEditor(q) {
      const isNew = !q;
      q = q || { cat: view.cat !== 'all' ? view.cat : 'datatypes', difficulty: 'easy', enabled: true,
                 order: Math.max(0, ...all.filter(x => x.cat === (view.cat !== 'all' ? view.cat : 'datatypes')).map(x => +x.order || 0)) + 1 };
      const kw = Array.isArray(q.keywords) ? q.keywords.join(', ') : (q.keywords || '');
      const ov = modal(`
        <div class="modal-head"><h2>${isNew ? '＋ 새 문제' : '✏️ 문제 수정 · ' + escapeHtml(q.id || q.key)}</h2><button class="icon-btn" data-close aria-label="닫기">✕</button></div>
        <form class="form-grid" id="qform">
          <div class="field"><label>주제</label><select class="select" name="cat" ${isNew ? '' : 'disabled'}>${cats().map(c => `<option value="${escapeHtml(c)}" ${c === q.cat ? 'selected' : ''}>${escapeHtml(catLabel(c))}</option>`).join('')}</select></div>
          <div class="field"><label>난이도</label><select class="select" name="difficulty">${Object.entries(DIFF).map(([k, v]) => `<option value="${k}" ${k === q.difficulty ? 'selected' : ''}>${v.label} (${v.points}점)</option>`).join('')}</select></div>
          <div class="field full"><label>문제</label><textarea class="textarea" name="question" required>${escapeHtml(q.question || '')}</textarea></div>
          <div class="field full"><label>예시 (학생 화면에 표시)</label><textarea class="textarea mono" name="example" style="min-height:70px">${escapeHtml(q.example || '')}</textarea></div>
          <div class="field full"><label>힌트</label><textarea class="textarea" name="hint" style="min-height:60px">${escapeHtml(q.hint || '')}</textarea></div>
          <div class="field full"><label>예상 출력 (채점 기준 · 공백/줄바꿈 차이는 무시)</label><textarea class="textarea mono" name="expectedOutput" style="min-height:70px">${escapeHtml(q.expectedOutput ?? '')}</textarea></div>
          <div class="field"><label>키워드 (쉼표 구분)</label><input class="input" name="keywords" value="${escapeHtml(kw)}"></div>
          <div class="field"><label>순서</label><input class="input" type="number" name="order" value="${escapeHtml(q.order ?? '')}"></div>
          <details class="field full tester" ${isNew ? 'open' : ''}>
            <summary style="cursor:pointer;font-weight:700">🌐 번역 (English · 中文) <span class="muted" style="font-weight:500">— 비워 두면 학생에게 한국어 원문이 보여요</span></summary>
            <div class="muted" style="font-size:.8rem;margin:8px 0 4px">한국어 문제를 고쳤다면 번역도 함께 고쳐 주세요. 출력해야 할 한국어 문자열(예: '합격')은 그대로 두세요. 예시가 코드뿐이면 번역 칸을 비워 두면 됩니다.</div>
            ${TR_LANGS.map(([lg, name]) => `<div style="margin-top:12px"><b>${name}</b>
              ${TR_FIELDS.map(([f, label]) => `<div class="field" style="margin-top:6px"><label style="font-weight:600">${label} (${lg})</label>
                <textarea class="textarea ${f === 'example' ? 'mono' : ''}" name="${f}_${lg}" style="min-height:${f === 'question' ? 70 : 52}px">${escapeHtml(isNew ? '' : trValue(q, lg, f))}</textarea></div>`).join('')}</div>`).join('')}
          </details>
          <div class="field full tester">
            <label>🧪 정답 코드로 예상 출력 만들기 <span class="muted" style="font-weight:500">(저장되지 않음)</span></label>
            <textarea class="textarea mono" id="test-code" placeholder="print('hello')" style="min-height:80px;margin-top:6px"></textarea>
            <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
              <button type="button" class="btn btn-soft btn-sm" id="test-run">▶ 실행</button>
              <button type="button" class="btn btn-soft btn-sm" id="test-apply" disabled>↓ 결과를 예상 출력에 넣기</button>
              <span class="muted" style="font-size:.8rem;align-self:center" id="test-status">학생 화면과 같은 Python 환경(Pyodide)에서 실행해요</span>
            </div>
            <div class="console hidden" id="test-out"></div>
          </div>
          <label class="full" style="display:flex;gap:10px;align-items:center;font-weight:700"><span class="switch"><input type="checkbox" name="enabled" ${q.enabled !== false ? 'checked' : ''}><span></span></span> 학생에게 공개 (활성)</label>
        </form>
        <div class="modal-foot"><button class="btn btn-ghost" data-close>취소</button><button class="btn btn-primary" id="save-q">${isNew ? '추가하기' : '저장하기'}</button></div>`, true);

      let lastOut = null;
      $('#test-run', ov).onclick = async () => {
        const code = $('#test-code', ov).value;
        if (!code.trim()) return toast('실행할 코드를 입력해 주세요.', 'error');
        const box = $('#test-out', ov); box.classList.remove('hidden', 'err'); box.textContent = '실행 중… (처음에는 Python 로딩에 10~20초 걸려요)';
        $('#test-status', ov).textContent = '';
        const r = await runPython(code);
        if (r.ok) { lastOut = (r.output || '').replace(/\s+$/, ''); box.textContent = lastOut || '(출력 없음)'; $('#test-apply', ov).disabled = false; }
        else { box.classList.add('err'); box.textContent = (r.output || '') + (r.error || ''); $('#test-apply', ov).disabled = true; }
      };
      $('#test-apply', ov).onclick = () => { if (lastOut != null) { ov.querySelector('[name=expectedOutput]').value = lastOut; toast('예상 출력에 반영했어요.', 'success'); } };

      $('#save-q', ov).onclick = async () => {
        const f = $('#qform', ov);
        const v = n => f.querySelector(`[name=${n}]`);
        const question = v('question').value.trim();
        if (!question) return toast('문제 내용을 입력해 주세요.', 'error');
        const cat = isNew ? v('cat').value : q.cat;
        const difficulty = v('difficulty').value;
        const data = {
          question,
          example: v('example').value,
          hint: v('hint').value.trim(),
          expectedOutput: v('expectedOutput').value.replace(/\s+$/, ''),
          keywords: v('keywords').value.split(',').map(s => s.trim()).filter(Boolean),
          difficulty,
          points: DIFF[difficulty].points,
          order: parseInt(v('order').value, 10) || 999,
          enabled: v('enabled').checked,
          category: cat,
          updatedAt: Date.now()
        };
        // 번역: 번역 파일과 같으면 DB에 따로 저장하지 않음 (빈 칸은 삭제)
        TR_LANGS.forEach(([lg]) => TR_FIELDS.forEach(([fld]) => {
          const val = v(`${fld}_${lg}`).value.trim();
          data[`${fld}_${lg}`] = (!val || (!isNew && val === fileTr(q, lg, fld))) ? null : val;
        }));
        if (!data.expectedOutput && !confirm('예상 출력이 비어 있으면 학생이 정답 처리되기 어려워요. 그래도 저장할까요?')) return;
        try {
          if (isNew) {
            const key = nextKeys(cat, 1)[0];
            const clean = Object.fromEntries(Object.entries(data).filter(([, x]) => x !== null));
            await database.ref(`questions/${cat}/${key}`).set({ ...clean, id: key, createdAt: Date.now() });
            toast(`${key} 문제를 추가했어요.`, 'success');
          } else {
            await database.ref(`questions/${cat}/${q.key}`).update(data);
            toast('저장했어요.', 'success');
          }
          ov.remove();
        } catch (e) { toast('저장 실패: ' + e.message, 'error'); }
      };
    }
    $('#add-btn').onclick = () => openEditor(null);

    /* ---------- 테스트 실행용 Python 워커 ---------- */
    let worker = null, wseq = 0; const wpending = new Map();
    function ensureWorker() {
      if (worker) return;
      worker = new Worker('py-worker.js');
      worker.onmessage = e => { const m = e.data; if (m.type === 'result' && wpending.has(m.id)) { const p = wpending.get(m.id); clearTimeout(p.t); wpending.delete(m.id); p.res(m); } };
      worker.postMessage({ type: 'init' });
    }
    function runPython(code) {
      ensureWorker();
      const id = ++wseq;
      return new Promise(res => {
        const t = setTimeout(() => { wpending.delete(id); worker.terminate(); worker = null; res({ ok: false, error: '⏱️ 60초 안에 끝나지 않아 중단했어요.' }); }, 60000);
        wpending.set(id, { res, t });
        worker.postMessage({ type: 'run', id, code });
      });
    }

    /* ---------- CSV 업로드 ---------- */
    const REQUIRED = ['category', 'question', 'example', 'hint', 'expectedOutput', 'keywords', 'difficulty', 'order'];

    // 따옴표 안의 쉼표·줄바꿈까지 처리하는 CSV 파서
    function parseCSV(text) {
      text = text.replace(/^﻿/, '');
      const rows = []; let row = [], cell = '', q = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (q) {
          if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
          else cell += c;
        } else if (c === '"') q = true;
        else if (c === ',') { row.push(cell); cell = ''; }
        else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
        else cell += c;
      }
      if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
      return rows.filter(r => r.some(x => x.trim() !== ''));
    }

    function openCsv() {
      const ov = modal(`
        <div class="modal-head"><h2>📂 CSV 일괄 업로드</h2><button class="icon-btn" data-close aria-label="닫기">✕</button></div>
        <p class="muted" style="font-size:.9rem;margin-bottom:12px">필수 열: <span class="mono">${REQUIRED.join(', ')}</span><br>
          category: ${TOPICS.map(t => t.key).join(' / ')} · difficulty: easy / medium / hard<br>
          선택 열(번역): <span class="mono">question_en, example_en, hint_en, question_zh, example_zh, hint_zh</span><br>
          새 문제는 <b>기존 문제 뒤에 추가</b>되며, 기존 ID와 겹치지 않게 자동 번호가 붙어요.</p>
        <button class="btn btn-ghost btn-sm" id="tpl" style="margin-bottom:12px">⬇️ CSV 양식 내려받기</button>
        <label class="drop" id="drop"><input type="file" id="csv-file" accept=".csv,text/csv" hidden>
          <div style="font-size:2rem">📄</div><b>CSV 파일을 끌어다 놓거나 클릭해서 선택</b><div class="muted" style="font-size:.85rem">UTF-8 인코딩 권장 (엑셀: CSV UTF-8로 저장)</div></label>
        <div id="csv-result"></div>
        <div class="modal-foot"><button class="btn btn-ghost" data-close>취소</button><button class="btn btn-success" id="csv-go" disabled>📤 업로드</button></div>`, true);

      let parsed = [];
      $('#tpl', ov).onclick = () => {
        const sample = 'category,question,example,hint,expectedOutput,keywords,difficulty,order\r\n' +
          'datatypes,"변수 a에 3, b에 4를 저장하고 a*b를 출력하세요.","a = 3; b = 4; print(a*b)","곱셈 연산자는 * 입니다.",12,"변수,곱셈",easy,1\r\n' +
          'pandas,"df의 행 개수를 출력하세요.","df = pd.DataFrame({\'x\':[1,2,3]}); print(len(df))","len() 함수를 사용합니다.",3,"len,DataFrame",medium,2\r\n';
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob(['﻿' + sample], { type: 'text/csv;charset=utf-8' }));
        a.download = 'question_template.csv'; a.click();
      };
      const drop = $('#drop', ov);
      ['dragover', 'dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
      ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
      drop.addEventListener('drop', e => e.dataTransfer.files[0] && read(e.dataTransfer.files[0]));
      $('#csv-file', ov).onchange = e => e.target.files[0] && read(e.target.files[0]);

      function read(file) {
        const r = new FileReader();
        r.onload = () => {
          const rows = parseCSV(r.result);
          const box = $('#csv-result', ov);
          if (rows.length < 2) { box.innerHTML = '<div class="issues">⚠️ 데이터가 없는 파일이에요.</div>'; return; }
          const head = rows[0].map(h => h.trim());
          const miss = REQUIRED.filter(h => !head.includes(h));
          if (miss.length) { box.innerHTML = `<div class="issues">⚠️ 필수 열이 없어요: ${escapeHtml(miss.join(', '))}</div>`; $('#csv-go', ov).disabled = true; return; }
          const idx = Object.fromEntries(head.map((h, i) => [h, i]));
          const issues = [];
          parsed = rows.slice(1).map((r, i) => {
            const g = k => (r[idx[k]] ?? '').trim();
            const item = {
              category: g('category'), question: g('question'), example: g('example').replace(/\\n/g, '\n'),
              hint: g('hint'), expectedOutput: (r[idx.expectedOutput] ?? '').replace(/\\n/g, '\n').replace(/\s+$/, ''),
              keywords: g('keywords').split(',').map(s => s.trim()).filter(Boolean),
              difficulty: g('difficulty').toLowerCase(), order: parseInt(g('order'), 10) || (i + 1)
            };
            // 선택 열: question_en, example_en, hint_en, question_zh, example_zh, hint_zh
            ['en', 'zh'].forEach(lg => ['question', 'example', 'hint'].forEach(f => {
              const col = `${f}_${lg}`;
              if (idx[col] != null && g(col)) item[col] = g(col).replace(/\\n/g, '\n');
            }));
            if (!/^[A-Za-z0-9_]+$/.test(item.category)) issues.push(`${i + 2}행: category 값이 올바르지 않음`);
            if (!item.question) issues.push(`${i + 2}행: question 비어 있음`);
            if (!DIFF[item.difficulty]) { issues.push(`${i + 2}행: difficulty "${item.difficulty}" → easy로 처리`); item.difficulty = 'easy'; }
            if (!item.expectedOutput) issues.push(`${i + 2}행: expectedOutput 비어 있음`);
            return item;
          });
          const bad = parsed.filter(p => !p.question || !/^[A-Za-z0-9_]+$/.test(p.category));
          parsed = parsed.filter(p => !bad.includes(p));
          box.innerHTML = `
            <div style="margin-top:14px;font-weight:700">✅ 업로드 가능한 문제 ${parsed.length}개${bad.length ? ` · 제외 ${bad.length}개` : ''}</div>
            ${issues.length ? `<div class="issues">${issues.slice(0, 8).map(escapeHtml).join('<br>')}${issues.length > 8 ? `<br>… 외 ${issues.length - 8}건` : ''}</div>` : ''}
            <div class="preview table-wrap"><table class="table"><thead><tr><th>주제</th><th>난이도</th><th>문제</th><th>예상 출력</th></tr></thead><tbody>
            ${parsed.slice(0, 20).map(p => `<tr><td>${escapeHtml(p.category)}</td><td>${escapeHtml(DIFF[p.difficulty].label)}</td><td>${escapeHtml(p.question.slice(0, 80))}</td><td class="mono">${escapeHtml(p.expectedOutput.slice(0, 40))}</td></tr>`).join('')}
            </tbody></table></div>`;
          $('#csv-go', ov).disabled = !parsed.length;
        };
        r.readAsText(file, 'UTF-8');
      }

      $('#csv-go', ov).onclick = async () => {
        const btn = $('#csv-go', ov); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 업로드 중…';
        const reserved = {}; const upd = {}; const now = Date.now();
        for (const p of parsed) {
          reserved[p.category] = reserved[p.category] || new Set();
          const key = nextKeys(p.category, 1, reserved[p.category])[0];
          reserved[p.category].add(key);
          upd[`${p.category}/${key}`] = { id: key, ...p, points: DIFF[p.difficulty].points, enabled: true, createdAt: now };
        }
        try {
          await database.ref('questions').update(upd);   // 한 번에 원자적으로 저장
          toast(`${parsed.length}개 문제를 추가했어요.`, 'success');
          ov.remove();
        } catch (e) { toast('업로드 실패: ' + e.message, 'error'); btn.disabled = false; btn.textContent = '📤 업로드'; }
      };
    }
    $('#csv-open').onclick = openCsv;

    /* ---------- 필터 ---------- */
    $('#search').oninput = e => { view.search = e.target.value.trim(); render(); };
    $('#diff-filter').onchange = e => { view.diff = e.target.value; render(); };
    $('#state-filter').onchange = e => { view.state = e.target.value; render(); };
  </script>
</body>
</html>
